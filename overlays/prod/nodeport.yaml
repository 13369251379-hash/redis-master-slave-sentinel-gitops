apiVersion: v1
kind: Service
metadata:
  name: redis-master-nodeport
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
    app.kubernetes.io/environment: prod
    app.kubernetes.io/component: master
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: redis-prod
    app.kubernetes.io/component: master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 32378
